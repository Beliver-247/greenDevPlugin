git:
  base_ref: HEAD~1
  head_ref: HEAD

# Leave modules empty to auto-discover modules from the root pom.xml or
# top-level directories containing pom.xml. Configure explicitly when module
# names differ from paths or when only a subset should be considered.
modules: []
# Example:
# modules:
#   - name: auth-service
#     path: auth-service/
#   - name: billing-service
#     path: services/billing-service/

shared_modules:
  - common-lib

rules:
  skip_non_code_changes: true
  doc_only_extensions:
    - .adoc
    - .asciidoc
    - .drawio
    - .gif
    - .jpeg
    - .jpg
    - .markdown
    - .md
    - .pdf
    - .png
    - .rst
    - .svg
    - .txt
  doc_file_names:
    - changelog
    - license
    - readme
    - readme.md
  global_trigger_paths:
    - pom.xml
    - .mvn/
    - mvnw
    - mvnw.cmd
    - settings.xml

maven:
  executable: mvn
  group_id: null
  also_make: true
  also_make_tests: false
  extra_args: []
  build_goals:
    - clean
    - install
  test_goals:
    - test
  run_build: true
  run_tests: true

output:
  format: json

# Carbon-aware scheduling configuration.
# Used when --carbon-aware flag is passed to the optimizer CLI.
carbon_aware:
  # "mock" uses hard-coded values (no API key needed, good for testing/CI demo).
  # "electricity_maps" calls the real Electricity Maps API v4.
  provider: mock

  # Electricity Maps API key. Can also be set via the ELECTRICITY_MAPS_API_KEY
  # environment variable (takes priority over this setting).
  electricity_maps_api_key: null

  # Grid zone for Electricity Maps queries. Sri Lanka = LK.
  electricity_maps_zone: LK

  # Path to the trained LightGBM model file (.joblib).
  # Leave null to use the model bundled with the plugin.
  model_path: null

  # Local file used to cache the rolling 168-hour carbon intensity history.
  # The scheduler appends to this file on each invocation.
  history_store_path: ~/.greendevops/carbon_history.json

  # Minimum number of recent hours in the history buffer before the ML model
  # is used. Below this threshold the rule-based engine is used instead (with
  # a console warning).
  min_history_hours: 3

  # When true, automatically backfill the last 168 hours from the API on the
  # first invocation (or when the history store is stale / empty).
  backfill_on_empty: true

